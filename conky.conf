-- ── Runtime helpers ──────────────────────────────────────────────
-- Detect the default-route interface at load time so the network
-- block works on Wi-Fi *and* Ethernet without editing the file.


local function default_iface()
    local f = io.popen("ip route get 1.1.1.1 2>/dev/null | awk '{print $5; exit}'")
    if not f then return "wlp4s0" end
    local i = f:read("*l")
    f:close()
    if not i or i == "" then return "wlp4s0" end
    return i
end
local NET = default_iface()

